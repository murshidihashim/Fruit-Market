<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#182844" />
    <!-- Opened from the iPhone Home Screen, the game runs full screen, without Safari's bars (PLAN-062) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fruit Market" />
    <title>Fruit Market</title>
    <meta name="description" content="Fruit Market: buy fresh fruit, set secret prices and sell fast before it spoils. A pixel-art market game for 1 to 4 players." />
    <!-- Rubik, the game's one font (DEC-068), fetched alongside the code so the opening's words never change font mid-scene. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/rubik/files/rubik-latin-800-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/rubik/files/rubik-latin-600-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/rubik/files/rubik-latin-400-normal.woff2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-512.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fruit Market" />
    <meta property="og:description" content="Buy fresh fruit, set secret prices and sell fast before it spoils. Play free in your browser." />
    <meta property="og:image" content="https://fruit-market.murshidi-hashim.workers.dev/icon-512.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
