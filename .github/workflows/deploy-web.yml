# Publishes the LIVE game. Runs only when the owner presses "Run workflow" in GitHub Actions
# (PLAN-001 / DEC-003): pushing to main never changes the live site.
name: Deploy LIVE game

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH to update the live game for all players'
        required: true

jobs:
  deploy:
    if: inputs.confirm == 'PUBLISH'
    runs-on: ubuntu-latest
    env:
      LIVE_URL: https://fruit-market.murshidi-hashim.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify (lint, types, unit tests, build)
        run: npm run verify
      - name: Deploy to Cloudflare (game + room server)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Smoke test the live site
        run: node scripts/smoke-live.mjs "$LIVE_URL"
