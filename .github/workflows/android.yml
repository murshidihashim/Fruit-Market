name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Step-level `if` can't read secrets directly, so expose whether the signing key exists.
      HAS_KEY: ${{ secrets.FM_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Debug APK (install on your phone to test)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Restore upload keystore
        if: env.HAS_KEY == 'true'
        run: echo "${{ secrets.FM_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Signed release bundle (upload this to Google Play)
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          FM_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          FM_KEYSTORE_PASSWORD: ${{ secrets.FM_KEYSTORE_PASSWORD }}
          FM_KEY_ALIAS: ${{ secrets.FM_KEY_ALIAS }}
          FM_KEY_PASSWORD: ${{ secrets.FM_KEY_PASSWORD }}
        run: ./gradlew bundleRelease -PversionCode=${{ github.run_number }} --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: fruit-market-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: fruit-market-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
