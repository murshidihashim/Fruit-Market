# Checks every push and pull request with `npm run verify:full`: lint, types, unit tests, build,
# and the browser tests (solo game, performance budget, online match with a leaver, quick match).
# After a push to main passes, the PREVIEW copy of the game is updated. The live game is not
# touched: it only changes through the "Deploy LIVE game" workflow (PLAN-001 / DEC-003).
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so the records check can compare with the previous commit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify everything (lint, types, unit tests, build, browser tests)
        run: npm run verify:full
        env:
          # CI machines vary; allow a little headroom over the local budget.
          MAX_TASK_MS: '250'
          MAX_ENTRY_MS: '600'
          # Records history must only grow: compare with the commit before this push (or the PR base).
          RECORDS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-output/
          retention-days: 7

  preview:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PREVIEW_URL: https://fruit-market-staging.murshidi-hashim.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Update the preview copy (separate Worker and data; not the live game)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging
      - name: Smoke test the preview
        run: node scripts/smoke-live.mjs "$PREVIEW_URL"
