<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D5: the result, ten days of coins</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&amp;family=Archivo+Black&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1f272a}a:hover{color:#b62528}
.ph{width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#fffcf5;color:#1f272a;font:600 12px/1.3 Archivo,system-ui,sans-serif;overflow:hidden;position:relative}
.win{flex:none;background:#1f272a;color:#fffcf5;padding:12px 12px 14px;display:flex;align-items:center;gap:10px}
.win .pic{width:64px;height:64px;border:2px solid #fec400;box-sizing:border-box;overflow:hidden;flex:none}
.win .pic img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.win small{display:block;font:800 10px/1 Archivo,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#fec400}
.win h2{margin:4px 0 3px;font:400 30px/.95 'Archivo Black',sans-serif;text-transform:uppercase}
.days{flex:none;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));border-bottom:2px solid #1f272a;font:800 11px/1 Archivo,sans-serif;text-align:center;color:#5a6266}
.days span{padding:10px 0}
.days .dn{background:#1f272a;color:#fffcf5}
.days .on{background:#fec400;color:#1f272a}
.tbl{flex:1;position:relative;display:flex;align-items:flex-end;gap:8px;padding:0 12px}
.ln{position:absolute;left:12px;right:12px;height:0;border-top:2px dashed #ddd4c6}
.ln em{position:absolute;right:0;top:-14px;font:800 9px/1 Archivo,sans-serif;font-style:normal;color:#5a6266;letter-spacing:.06em}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative}
.stk{width:56px;display:flex;flex-direction:column-reverse;border:2px solid #1f272a;border-top:0;border-bottom:0}
.stk i{display:block;box-sizing:border-box;border-top:2px solid #1f272a;background:repeating-linear-gradient(0deg,#b98a00 0 1px,transparent 1px 5px),linear-gradient(90deg,transparent 0 8px,#ffe58a 8px 16px,transparent 16px),#fec400}
.stamp{width:58px;height:58px;border-radius:50%;box-sizing:border-box;border:3px solid #b62528;box-shadow:inset 0 0 0 3px #fffcf5,inset 0 0 0 5px #b62528;color:#b62528;background:#fffcf5;display:grid;place-items:center;font:400 17px/1 'Archivo Black',sans-serif;transform:rotate(-12deg);margin-bottom:8px}
.plate{align-self:stretch;position:relative;height:112px;box-sizing:border-box;border:2px solid #1f272a;background:#fffcf5;display:flex;flex-direction:column;align-items:center;gap:4px}
.me .plate{background:#fec400}
.awn{align-self:stretch;height:12px;background:repeating-linear-gradient(90deg,var(--a) 0 10px,#fffcf5 10px 20px);border-bottom:2px solid #1f272a;margin-bottom:5px}
.pl{position:absolute;left:0;top:14px;background:#1f272a;color:#fffcf5;font:800 9px/1 Archivo,sans-serif;letter-spacing:.06em;padding:4px 4px}
.plate img{width:40px;height:40px;border:2px solid #1f272a;box-sizing:border-box;display:block}
.plate b{font:800 11px/1 Archivo,sans-serif;white-space:nowrap}
.plate .cs{font:400 17px/1 'Archivo Black',sans-serif}
.peek{flex:none;margin:14px 12px 0;border:2px solid #1f272a;border-bottom:0;display:flex;flex-direction:column}
.peek .ch{display:flex;justify-content:space-between;align-items:center;background:#1f272a;color:#fffcf5;padding:7px 9px;font:800 10px/1 Archivo,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.peek .ch b{color:#fec400}
.peek .earn{display:flex;align-items:center;gap:8px;padding:6px 9px 3px}
.peek .earn b{width:30px;font:400 15px/1 'Archivo Black',sans-serif;color:#b62528}
</style>
</helmet>
<div class="ph">
  <div class="win"><span class="pic"><img src="/_blob/2941640bc47e3907cd0bd1a48811bb2a" alt="Rosa at her stall"></span><div><small>Market closed · day 10</small><h2>You win</h2><span>By $6 over Ah Chen.</span></div></div>

  <div class="days"><span class="dn">1</span><span class="dn">2</span><span class="dn">3</span><span class="dn">4</span><span class="dn">5</span><span class="dn">6</span><span class="dn">7</span><span class="dn">8</span><span class="dn">9</span><span class="dn">10</span></div>

  <div class="tbl">
    <i class="ln" style="bottom: 262px"><em>$30</em></i>
    <i class="ln" style="bottom: 412px"><em>$60</em></i>
    <i class="ln" style="bottom: 562px"><em>$90</em></i>

    <div class="col me">
      <i class="stamp" style="font-style: normal">1ST</i>
      <div class="stk"><i style="height: 50px"></i><i style="height: 20px"></i><i style="height: 25px"></i><i style="height: 25px"></i><i style="height: 35px"></i><i style="height: 45px"></i><i style="height: 50px"></i><i style="height: 55px"></i><i style="height: 40px"></i><i style="height: 45px"></i><i style="height: 45px"></i></div>
      <div class="plate"><div class="awn" style="--a: #e73c35"></div><span class="pl">1ST</span><img src="/_blob/7ec847704e70fff5058e715c6949bf54" alt="Rosa"><b>You</b><span class="cs">$87</span></div>
    </div>
    <div class="col">
      <div class="stk"><i style="height: 50px"></i><i style="height: 30px"></i><i style="height: 35px"></i><i style="height: 35px"></i><i style="height: 40px"></i><i style="height: 35px"></i><i style="height: 35px"></i><i style="height: 30px"></i><i style="height: 40px"></i><i style="height: 40px"></i><i style="height: 35px"></i></div>
      <div class="plate"><div class="awn" style="--a: #3558a2"></div><span class="pl">2ND</span><img src="/_blob/5e619e49290b8a4943822d149982cedf" alt="Ah Chen"><b>Ah Chen</b><span class="cs">$81</span></div>
    </div>
    <div class="col">
      <div class="stk"><i style="height: 50px"></i><i style="height: 15px"></i><i style="height: 25px"></i><i style="height: 25px"></i><i style="height: 30px"></i><i style="height: 35px"></i><i style="height: 30px"></i><i style="height: 25px"></i><i style="height: 30px"></i><i style="height: 30px"></i><i style="height: 25px"></i></div>
      <div class="plate"><div class="awn" style="--a: #0e9a58"></div><span class="pl">3RD</span><img src="/_blob/479978044c380ca1e85bf3f09ff701ba" alt="Farah"><b>Farah</b><span class="cs">$64</span></div>
    </div>
    <div class="col">
      <div class="stk"><i style="height: 50px"></i><i style="height: 10px"></i><i style="height: 20px"></i><i style="height: 25px"></i><i style="height: 15px"></i><i style="height: 30px"></i><i style="height: 25px"></i><i style="height: 30px"></i><i style="height: 30px"></i><i style="height: 25px"></i></div>
      <div class="plate"><div class="awn" style="--a: #b98a00"></div><span class="pl">4TH</span><img src="/_blob/4b9df8666eda0e9a49392164b22b6b3f" alt="Uncle Benny"><b>Uncle Benny</b><span class="cs">$52</span></div>
    </div>
  </div>

  <div class="peek">
    <div class="ch"><span>Stamps earned</span><b>+9</b></div>
    <div class="earn"><b>+3</b><span>10 days played</span></div>
  </div>
</div>
