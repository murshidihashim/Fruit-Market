body{margin:0}
a{color:#1f272a}a:hover{color:#b62528}

.days .on{background:#fec400;color:#1f272a}
.tbl{flex:1;position:relative;display:flex;align-items:flex-end;gap:5px;padding:0 8px}
.ln{position:absolute;left:8px;right:8px;height:0;border-top:2px dashed #ddd4c6}

.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative}
.stk{width:36px;display:flex;flex-direction:column-reverse;border:2px solid #1f272a;border-top:0;border-bottom:0}
.stk i,.drop{display:block;box-sizing:border-box;background:repeating-linear-gradient(0deg,#b98a00 0 1px,transparent 1px 4px),linear-gradient(90deg,transparent 0 5px,#ffe58a 5px 11px,transparent 11px),#fec400}
.stk i{border-top:2px solid #1f272a}
.drop{width:40px;border:2px solid #1f272a;margin-bottom:12px}
.gain{background:#cfeedd;color:#1f272a;box-shadow:inset 0 0 0 2px #0e9a58;font:800 10px/1 Archivo,sans-serif;padding:4px 4px;margin-bottom:5px}
.plate{align-self:stretch;position:relative;height:100px;box-sizing:border-box;border:2px solid #1f272a;background:#fffcf5;display:flex;flex-direction:column;align-items:center;gap:3px}
.me .plate{background:#fec400}
.awn{align-self:stretch;height:9px;background:repeating-linear-gradient(90deg,var(--a) 0 8px,#fffcf5 8px 16px);border-bottom:2px solid #1f272a;margin-bottom:11px}
.pl{position:absolute;left:0;top:11px;background:#1f272a;color:#fffcf5;font:800 8px/1 Archivo,sans-serif;letter-spacing:.04em;padding:2px 3px}
.plate img{width:30px;height:30px;border:2px solid #1f272a;box-sizing:border-box;display:block}
.plate b{height:18px;display:grid;place-items:center;text-align:center;font:800 9px/1 Archivo,sans-serif}
.plate .cs{font:400 14px/1 'Archivo Black',sans-serif}
.skip{flex:none;text-align:center;padding:8px 0 10px;color:#5a6266;font:700 11px/1 Archivo,sans-serif}
