  <path fill="none" d="M 385 789 L 374 790 M 386 811 L 375 811 M 386 831 L 375 830"/>
  <path fill="#f6d2b0" d="M 546 892 C 540 882 540 868 548 864 C 554 861 559 864 561 870 C 562 860 569 857 575 859 C 581 861 583 867 583 872 C 585 863 592 860 597 863 C 603 866 604 873 603 878 C 606 871 613 870 617 875 C 621 881 619 890 612 898 C 596 908 556 906 546 892 Z"/>
  <path fill="none" d="M 561 870 L 562 882 M 583 872 L 583 884 M 603 878 L 602 888"/>

