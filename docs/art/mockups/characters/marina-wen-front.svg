    <path fill="none" d="M 526 365 C 542 359 560 358 578 364"/>
    <ellipse fill="#2b2438" stroke="none" cx="430" cy="410" rx="13" ry="19"/>
    <ellipse fill="#2b2438" stroke="none" cx="548" cy="407" rx="14.5" ry="20"/>
    <circle fill="#fffdf7" stroke="none" cx="425" cy="402" r="5"/>
    <circle fill="#fffdf7" stroke="none" cx="543" cy="399" r="5.5"/>
    <path fill="none" d="M 482 424 C 474 444 468 460 476 467 C 482 472 492 470 496 465"/>
    <path fill="none" d="M 458 510 C 474 524 502 526 524 506"/>

