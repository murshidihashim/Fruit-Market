    <path fill="#4a4058" d="M 602 262 C 640 285 642 340 638 372 C 625 330 610 305 596 292 C 560 310 480 325 430 336 C 400 343 382 356 368 378 C 356 340 362 290 410 258 C 460 226 560 228 602 262 Z"/>
    <path fill="none" d="M 560 268 C 520 290 470 305 430 315"/>

